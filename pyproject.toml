[project]
name = "pdf-to-sentences"
version = "1.3.0"
description = "PDF to sentences extraction microservice with a pypdfium2 fast path and PP-OCRv5 RapidOCR ONNX fallback (DTU NLP & LLM assignment)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Required by FastAPI/Starlette at runtime for UploadFile/File parameters
    # (never imported by name, but the endpoints fail without it).
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.5",
    # Explicit: Settings(env_file=".env") reads .env files through python-dotenv.
    "python-dotenv>=0.21.0",
    "rapidocr-onnxruntime>=1.4",
    "pyyaml>=6.0",
    "pypdfium2>=4.30",
    "nltk>=3.9",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # tests/test_metrics.py uses @pytest.mark.anyio (async test plugin).
    "anyio>=4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
